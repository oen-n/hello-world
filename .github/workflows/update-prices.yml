name: Mise à jour des prix

on:
  schedule:
    - cron: "17 4-20/2 * * *"   # toutes les 2 heures de 5h à 21h (heure de Paris, hiver)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire l'historique des prix
        run: python3 scripts/update_history.py
      - name: Notifications (ntfy)
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'plein-malin-cholet-maulevrier' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/notify.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Prix du $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
